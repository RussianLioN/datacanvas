<svg xmlns="http://www.w3.org/2000/svg" data-role="bmc-root" role="img" width="3840" height="2160" viewBox="0 0 3840 2160">
<title>DataCanvas Business Model Canvas</title>
<desc>Классическая канва бизнес-модели DataCanvas: верхний ряд B8, B7/B6, B2, B4/B3, B1; нижний ряд B9 и B5.</desc>
<rect data-role="bmc-background" width="3840" height="2160" fill="#f8fafc"/>
<rect data-role="bmc-frame" x="88" y="72" width="3664" height="2016" rx="18" fill="#ffffff" stroke="#d7dee8" stroke-width="3"/>
<text data-role="bmc-title" x="174" y="158" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="820" fill="#111827">DataCanvas Business Model Canvas</text>
<text data-role="bmc-subtitle" x="174" y="216" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="420" fill="#526174">Классическая структура: B8 | B7/B6 | B2 | B4/B3 | B1, нижний ряд B9 | B5</text>
<g data-role="bmc-top-row">
<g data-role="bmc-block" data-block="B8" data-layout-slot="top-left" transform="translate(174 280)">
<rect width="640" height="1180" rx="8" fill="#e8f2ed" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#047857" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#047857">B8</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760" fill="#111827"><tspan x="34" y="122">Партнеры</tspan></text>
<line x1="34" y1="182" x2="606" y2="182" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="400" fill="#26313f"><tspan x="42" y="238">Ключевые партнеры DataCanvas:</tspan><tspan x="42" y="277">Лиса, другой агент или контур</tspan><tspan x="42" y="316">оркестрации, владельцы</tspan><tspan x="42" y="355">источников данных, владельцы</tspan><tspan x="42" y="394">почтового канала доставки,</tspan><tspan x="42" y="433">владельцы защищенного хранилища,</tspan><tspan x="42" y="472">команда вызывающего агента и</tspan><tspan x="42" y="511">команда Лисы, которые показывают</tspan><tspan x="42" y="550">ссылку пользователю.</tspan><tspan x="42" y="589">• Лиса как контур</tspan><tspan x="42" y="628">пользовательского</tspan><tspan x="42" y="667">взаимодействия</tspan><tspan x="42" y="706">• Другой агент или контур</tspan><tspan x="42" y="745">оркестрации как источник</tspan><tspan x="42" y="784">подготовленного контекста</tspan><tspan x="42" y="823">• Владельцы источников данных</tspan><tspan x="42" y="862">• Владельцы почтового канала</tspan><tspan x="42" y="901">доставки</tspan><tspan x="42" y="940">• Владельцы защищенного</tspan><tspan x="42" y="979">хранилища PDF-копий</tspan><tspan x="42" y="1018">• Команда вызывающего агента и</tspan><tspan x="42" y="1057">команда Лисы, которые показывают</tspan><tspan x="42" y="1096">пользователю ссылку и</tspan><tspan x="42" y="1135">уведомление</tspan></text>
</g>
<g data-role="bmc-block" data-block="B7" data-layout-slot="top-split-upper" transform="translate(842 280)">
<rect width="640" height="576" rx="8" fill="#edf7f4" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#0f766e" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f766e">B7</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Активности</tspan></text>
<line x1="34" y1="172" x2="606" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#26313f"><tspan x="42" y="222">• Прием задачи и подготовленного</tspan><tspan x="42" y="252">контекста</tspan><tspan x="42" y="282">• Проверка пригодности входных данных</tspan><tspan x="42" y="312">• Определение получателя результата из</tspan><tspan x="42" y="342">входного пакета</tspan><tspan x="42" y="372">• Уточнение недостающего в Лисе, если</tspan><tspan x="42" y="402">это требуется режимом</tspan><tspan x="42" y="432">• Подготовка PPTX/PDF-результата и</tspan><tspan x="42" y="462">отправка по электронной почте</tspan><tspan x="42" y="492">• Передача ссылки на PDF-копию</tspan><tspan x="42" y="522">вызывающему агенту для показа</tspan><tspan x="42" y="552">пользователю в Лисе</tspan></text>
</g>
<g data-role="bmc-block" data-block="B6" data-layout-slot="top-split-lower" transform="translate(842 884)">
<rect width="640" height="576" rx="8" fill="#f4fbf9" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#0f766e" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f766e">B6</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Ресурсы</tspan></text>
<line x1="34" y1="172" x2="606" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">• Подготовленный входной контекст</tspan><tspan x="42" y="257">• Данные для определения</tspan><tspan x="42" y="292">получателя результата</tspan><tspan x="42" y="327">• Правила достаточности и</tspan><tspan x="42" y="362">безопасности данных</tspan><tspan x="42" y="397">• Шаблоны презентаций</tspan><tspan x="42" y="432">• Правила качества и способ</tspan><tspan x="42" y="467">подготовки PPTX/PDF-файлов</tspan><tspan x="42" y="502">• Контур хранения PDF-копии для</tspan><tspan x="42" y="537">доставки по ссылке</tspan></text>
</g>
<g data-role="bmc-block" data-block="B2" data-layout-slot="top-center" transform="translate(1510 280)">
<rect width="820" height="1180" rx="8" fill="#fff4cc" stroke="#243447" stroke-width="3"/>
<rect width="820" height="16" rx="8" fill="#b45309" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#b45309">B2</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760" fill="#111827"><tspan x="34" y="122">Ценность</tspan></text>
<line x1="34" y1="182" x2="786" y2="182" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="400" fill="#26313f"><tspan x="42" y="238">DataCanvas дает пользователю и вызывающему</tspan><tspan x="42" y="277">агенту готовый путь от проверенного</tspan><tspan x="42" y="316">контекста к рабочей презентации:</tspan><tspan x="42" y="355">пользователь получает редактируемый</tspan><tspan x="42" y="394">PPTX-файл и нередактируемую PDF-копию, а</tspan><tspan x="42" y="433">другой агент может переиспользовать</tspan><tspan x="42" y="472">DataCanvas вместо разработки собственного</tspan><tspan x="42" y="511">модуля подготовки презентаций.</tspan><tspan x="42" y="550">• Готовый путь от проверенного контекста к</tspan><tspan x="42" y="589">рабочей презентации</tspan><tspan x="42" y="628">• Переиспользование DataCanvas другим</tspan><tspan x="42" y="667">агентом вместо отдельного презентационного</tspan><tspan x="42" y="706">модуля</tspan><tspan x="42" y="745">• Редактируемый PPTX-файл для дальнейшей</tspan><tspan x="42" y="784">самостоятельной работы пользователя</tspan><tspan x="42" y="823">• Нередактируемая PDF-копия для передачи,</tspan><tspan x="42" y="862">просмотра и будущей ссылки</tspan><tspan x="42" y="901">• Меньше ручного переноса, структурирования</tspan><tspan x="42" y="940">информации и разбора длинных ответов в чате</tspan></text>
</g>
<g data-role="bmc-block" data-block="B4" data-layout-slot="top-split-upper" transform="translate(2358 280)">
<rect width="640" height="576" rx="8" fill="#eaf0fa" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#2563eb" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#2563eb">B4</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Отношения</tspan></text>
<line x1="34" y1="172" x2="606" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">• Управляемый диалог в Лисе</tspan><tspan x="42" y="257">• Уточнения и правки описания до</tspan><tspan x="42" y="292">подготовки презентации</tspan><tspan x="42" y="327">• Автоматическое выполнение при</tspan><tspan x="42" y="362">запуске другим агентом</tspan><tspan x="42" y="397">• Самостоятельное редактирование</tspan><tspan x="42" y="432">файла после доставки</tspan></text>
</g>
<g data-role="bmc-block" data-block="B3" data-layout-slot="top-split-lower" transform="translate(2358 884)">
<rect width="640" height="576" rx="8" fill="#f2f6fd" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#2563eb" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#2563eb">B3</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Каналы</tspan></text>
<line x1="34" y1="172" x2="606" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">• Лиса как пользовательский канал</tspan><tspan x="42" y="257">диалога</tspan><tspan x="42" y="292">• Запуск другим агентом как канал</tspan><tspan x="42" y="327">передачи подготовленного</tspan><tspan x="42" y="362">контекста</tspan><tspan x="42" y="397">• Электронная почта как основной</tspan><tspan x="42" y="432">канал доставки PPTX- и PDF-файлов</tspan><tspan x="42" y="467">• Ссылка на PDF-копию и</tspan><tspan x="42" y="502">уведомление в Лисе как канал</tspan><tspan x="42" y="537">доступа к готовому результату</tspan></text>
</g>
<g data-role="bmc-block" data-block="B1" data-layout-slot="top-right" transform="translate(3026 280)">
<rect width="640" height="1180" rx="8" fill="#e9eff9" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#1d4ed8" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#1d4ed8">B1</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760" fill="#111827"><tspan x="34" y="122">Сегменты</tspan></text>
<line x1="34" y1="182" x2="606" y2="182" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="400" fill="#26313f"><tspan x="42" y="238">Текущий основной</tspan><tspan x="42" y="277">пользовательский сегмент</tspan><tspan x="42" y="316">DataCanvas — КМ; CSM и другие</tspan><tspan x="42" y="355">пользователи Лисы остаются</tspan><tspan x="42" y="394">перспективными сегментами</tspan><tspan x="42" y="433">развития.</tspan><tspan x="42" y="472">• КМ как основной текущий</tspan><tspan x="42" y="511">пользовательский сегмент</tspan><tspan x="42" y="550">• CSM как перспективный сегмент</tspan><tspan x="42" y="589">развития</tspan><tspan x="42" y="628">• Другие пользователи Лисы как</tspan><tspan x="42" y="667">возможное расширение</tspan><tspan x="42" y="706">• Выгодополучатели и бюджетные</tspan><tspan x="42" y="745">владельцы не смешиваются с</tspan><tspan x="42" y="784">пользовательскими сегментами</tspan></text>
</g>
</g>
<g data-role="bmc-bottom-row">
<g data-role="bmc-block" data-block="B9" data-layout-slot="bottom-left" data-extra-role="bmc-cost-row" transform="translate(174 1488)">
<rect width="1732" height="500" rx="8" fill="#f7e9e2" stroke="#243447" stroke-width="3"/>
<rect width="1732" height="16" rx="8" fill="#c2410c" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#c2410c">B9</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Затраты</tspan></text>
<line x1="34" y1="172" x2="1698" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">Структура затрат DataCanvas включает вычислительные ресурсы искусственного интеллекта, подготовку</tspan><tspan x="42" y="257">редактируемого файла, поддержку интеграций, эксплуатацию и проверки качества.</tspan><tspan x="42" y="292">• Вычислительные ресурсы искусственного интеллекта</tspan><tspan x="42" y="327">• Подготовка редактируемого файла</tspan><tspan x="42" y="362">• Поддержка интеграций</tspan><tspan x="42" y="397">• Эксплуатация и проверки качества</tspan></text>
</g>
<g data-role="bmc-block" data-block="B5" data-layout-slot="bottom-right" data-extra-role="bmc-value-stream-row" transform="translate(1934 1488)">
<rect width="1732" height="500" rx="8" fill="#f8ede5" stroke="#243447" stroke-width="3"/>
<rect width="1732" height="16" rx="8" fill="#9a3412" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#9a3412">B5</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Внутренняя польза</tspan></text>
<line x1="34" y1="172" x2="1698" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">Для внутреннего продукта DataCanvas поток внутренней пользы выражается в экономии времени, снижении</tspan><tspan x="42" y="257">ручной работы, более быстром получении PPTX/PDF-результата и возможности переиспользовать общий</tspan><tspan x="42" y="292">презентационный сервис другими агентами.</tspan><tspan x="42" y="327">• Экономия времени КМ</tspan><tspan x="42" y="362">• Снижение ручной работы при подготовке презентации</tspan><tspan x="42" y="397">• Более быстрый переход от контекста к рабочему PPTX/PDF-результату</tspan><tspan x="42" y="432">• Повторное использование DataCanvas другими агентами вместо разработки отдельных презентационных</tspan><tspan x="42" y="467">модулей</tspan></text>
</g>
</g>
<text data-role="bmc-footer" x="174" y="2054" font-family="Inter, Arial, sans-serif" font-size="24" fill="#64748b">SVG является каноническим визуальным источником; PNG и PDF генерируются из него.</text>
</svg>
