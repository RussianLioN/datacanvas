<svg xmlns="http://www.w3.org/2000/svg" data-role="bmc-root" role="img" width="3840" height="2160" viewBox="0 0 3840 2160">
<title>DataCanvas Business Model Canvas</title>
<desc>Классическая канва бизнес-модели DataCanvas: верхний ряд B8, B7/B6, B2, B4/B3, B1; нижний ряд B9 и B5.</desc>
<rect data-role="bmc-background" width="3840" height="2160" fill="#f8fafc"/>
<rect x="88" y="72" width="3664" height="2016" rx="18" fill="#ffffff" stroke="#d7dee8" stroke-width="3"/>
<text data-role="bmc-title" x="174" y="158" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="820" fill="#111827">DataCanvas Business Model Canvas</text>
<text data-role="bmc-subtitle" x="174" y="216" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="420" fill="#526174">Классическая структура: B8 | B7/B6 | B2 | B4/B3 | B1, нижний ряд B9 | B5</text>
<g data-role="bmc-top-row">
<g data-role="bmc-block" data-block="B8" data-layout-slot="top-left" transform="translate(174 280)">
<rect width="640" height="1120" rx="8" fill="#e8f2ed" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#047857" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#047857">B8</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760" fill="#111827"><tspan x="34" y="122">Партнеры</tspan></text>
<line x1="34" y1="182" x2="606" y2="182" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="400" fill="#26313f"><tspan x="42" y="238">Ключевые партнеры DataCanvas: Лиса,</tspan><tspan x="42" y="277">другой агент или контур оркестрации,</tspan><tspan x="42" y="316">владельцы источников данных и</tspan><tspan x="42" y="355">владельцы почтового канала доставки.</tspan><tspan x="42" y="394">• Лиса как контур пользовательского</tspan><tspan x="42" y="433">взаимодействия</tspan><tspan x="42" y="472">• Другой агент или контур</tspan><tspan x="42" y="511">оркестрации как источник</tspan><tspan x="42" y="550">подготовленного контекста</tspan><tspan x="42" y="589">• Владельцы источников данных</tspan><tspan x="42" y="628">• Владельцы почтового канала</tspan><tspan x="42" y="667">доставки</tspan></text>
</g>
<g data-role="bmc-block" data-block="B7" data-layout-slot="top-split-upper" transform="translate(842 280)">
<rect width="640" height="546" rx="8" fill="#edf7f4" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#0f766e" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f766e">B7</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Активности</tspan></text>
<line x1="34" y1="172" x2="606" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">• Прием задачи и подготовленного</tspan><tspan x="42" y="259">контекста</tspan><tspan x="42" y="296">• Проверка пригодности входных данных</tspan><tspan x="42" y="333">• Уточнение недостающего в Лисе, если</tspan><tspan x="42" y="370">это требуется режимом</tspan><tspan x="42" y="407">• Подготовка презентации</tspan><tspan x="42" y="444">• Отправка готового файла пользователю</tspan></text>
</g>
<g data-role="bmc-block" data-block="B6" data-layout-slot="top-split-lower" transform="translate(842 854)">
<rect width="640" height="546" rx="8" fill="#f4fbf9" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#0f766e" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f766e">B6</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Ресурсы</tspan></text>
<line x1="34" y1="172" x2="606" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">• Подготовленный входной контекст</tspan><tspan x="42" y="259">• Правила достаточности и безопасности</tspan><tspan x="42" y="296">данных</tspan><tspan x="42" y="333">• Шаблоны презентаций</tspan><tspan x="42" y="370">• Правила качества результата</tspan><tspan x="42" y="407">• Способ подготовки редактируемого</tspan><tspan x="42" y="444">файла</tspan></text>
</g>
<g data-role="bmc-block" data-block="B2" data-layout-slot="top-center" transform="translate(1510 280)">
<rect width="820" height="1120" rx="8" fill="#fff4cc" stroke="#243447" stroke-width="3"/>
<rect width="820" height="16" rx="8" fill="#b45309" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#b45309">B2</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760" fill="#111827"><tspan x="34" y="122">Ценность</tspan></text>
<line x1="34" y1="182" x2="786" y2="182" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="400" fill="#26313f"><tspan x="42" y="238">DataCanvas дает пользователю и вызывающему</tspan><tspan x="42" y="277">агенту готовый путь от проверенного контекста к</tspan><tspan x="42" y="316">редактируемой презентации: пользователь быстрее</tspan><tspan x="42" y="355">получает рабочий материал, а другой агент может</tspan><tspan x="42" y="394">переиспользовать DataCanvas вместо разработки</tspan><tspan x="42" y="433">собственного модуля подготовки презентаций.</tspan><tspan x="42" y="472">• Готовый путь от проверенного контекста к</tspan><tspan x="42" y="511">рабочей презентации</tspan><tspan x="42" y="550">• Переиспользование DataCanvas другим агентом</tspan><tspan x="42" y="589">вместо отдельного презентационного модуля</tspan><tspan x="42" y="628">• Меньше ручного переноса, структурирования</tspan><tspan x="42" y="667">информации и разбора длинных ответов в чате</tspan><tspan x="42" y="706">• Редактируемый файл, с которым пользователь</tspan><tspan x="42" y="745">может работать дальше</tspan><tspan x="42" y="784">- Вызывающий агент может передать DataCanvas</tspan><tspan x="42" y="823">подготовленный контекст и использовать готовый</tspan><tspan x="42" y="862">маршрут подготовки презентации без разработки</tspan><tspan x="42" y="901">отдельного презентационного модуля.</tspan><tspan x="42" y="940">- Пользователь получает краткую структуру и</tspan><tspan x="42" y="979">редактируемую презентацию вместо ручной сборки</tspan><tspan x="42" y="1018">из длинного текста.</tspan><tspan x="42" y="1057">- DataCanvas сокращает путь от собранных данных</tspan><tspan x="42" y="1096">до презентации и снижает дублирование</tspan><tspan x="42" y="1135">презентационной логики в других агентских</tspan><tspan x="42" y="1174">сценариях.</tspan></text>
</g>
<g data-role="bmc-block" data-block="B4" data-layout-slot="top-split-upper" transform="translate(2358 280)">
<rect width="640" height="546" rx="8" fill="#eaf0fa" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#2563eb" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#2563eb">B4</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Отношения</tspan></text>
<line x1="34" y1="172" x2="606" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">• Управляемый диалог в Лисе</tspan><tspan x="42" y="259">• Уточнения и правки описания до</tspan><tspan x="42" y="296">подготовки презентации</tspan><tspan x="42" y="333">• Автоматическое выполнение при</tspan><tspan x="42" y="370">запуске другим агентом</tspan><tspan x="42" y="407">• Самостоятельное редактирование файла</tspan><tspan x="42" y="444">после доставки</tspan></text>
</g>
<g data-role="bmc-block" data-block="B3" data-layout-slot="top-split-lower" transform="translate(2358 854)">
<rect width="640" height="546" rx="8" fill="#f2f6fd" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#2563eb" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#2563eb">B3</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Каналы</tspan></text>
<line x1="34" y1="172" x2="606" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">• Лиса как пользовательский канал</tspan><tspan x="42" y="259">диалога</tspan><tspan x="42" y="296">• Запуск другим агентом как канал</tspan><tspan x="42" y="333">передачи подготовленного контекста</tspan><tspan x="42" y="370">• Электронная почта как канал доставки</tspan><tspan x="42" y="407">готового файла</tspan><tspan x="42" y="444">• Редактируемый формат результата как</tspan><tspan x="42" y="481">часть канала передачи</tspan></text>
</g>
<g data-role="bmc-block" data-block="B1" data-layout-slot="top-right" transform="translate(3026 280)">
<rect width="640" height="1120" rx="8" fill="#e9eff9" stroke="#243447" stroke-width="3"/>
<rect width="640" height="16" rx="8" fill="#1d4ed8" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#1d4ed8">B1</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760" fill="#111827"><tspan x="34" y="122">Сегменты</tspan></text>
<line x1="34" y1="182" x2="606" y2="182" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="400" fill="#26313f"><tspan x="42" y="238">Текущий основной пользовательский</tspan><tspan x="42" y="277">сегмент DataCanvas — КМ; CSM и</tspan><tspan x="42" y="316">другие пользователи Лисы остаются</tspan><tspan x="42" y="355">перспективными сегментами развития.</tspan><tspan x="42" y="394">• КМ как основной текущий</tspan><tspan x="42" y="433">пользовательский сегмент</tspan><tspan x="42" y="472">• CSM как перспективный сегмент</tspan><tspan x="42" y="511">развития</tspan><tspan x="42" y="550">• Другие пользователи Лисы как</tspan><tspan x="42" y="589">возможное расширение</tspan><tspan x="42" y="628">• Выгодополучатели и бюджетные</tspan><tspan x="42" y="667">владельцы не смешиваются с</tspan><tspan x="42" y="706">пользовательскими сегментами</tspan></text>
</g>
</g>
<g data-role="bmc-bottom-row">
<g data-role="bmc-block" data-block="B9" data-layout-slot="bottom-left" data-extra-role="bmc-cost-row" transform="translate(174 1490)">
<rect width="1732" height="500" rx="8" fill="#f7e9e2" stroke="#243447" stroke-width="3"/>
<rect width="1732" height="16" rx="8" fill="#c2410c" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#c2410c">B9</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Затраты</tspan></text>
<line x1="34" y1="172" x2="1698" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">Структура затрат DataCanvas включает вычислительные ресурсы искусственного интеллекта, подготовку редактируемого</tspan><tspan x="42" y="259">файла, поддержку интеграций, эксплуатацию и проверки качества.</tspan><tspan x="42" y="296">• Вычислительные ресурсы искусственного интеллекта</tspan><tspan x="42" y="333">• Подготовка редактируемого файла</tspan><tspan x="42" y="370">• Поддержка интеграций</tspan><tspan x="42" y="407">• Эксплуатация и проверки качества</tspan></text>
</g>
<g data-role="bmc-block" data-block="B5" data-layout-slot="bottom-right" data-extra-role="bmc-value-stream-row" transform="translate(1934 1490)">
<rect width="1732" height="500" rx="8" fill="#f8ede5" stroke="#243447" stroke-width="3"/>
<rect width="1732" height="16" rx="8" fill="#9a3412" opacity="0.95"/>
<text data-role="bmc-block-number" x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#9a3412">B5</text>
<text data-role="bmc-block-title" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="760" fill="#111827"><tspan x="34" y="122">Внутренняя польза</tspan></text>
<line x1="34" y1="172" x2="1698" y2="172" stroke="#cbd5e1" stroke-width="2"/>
<text data-role="bmc-block-body" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#26313f"><tspan x="42" y="222">Для внутреннего продукта DataCanvas поток внутренней пользы выражается в экономии времени, снижении ручной работы</tspan><tspan x="42" y="259">и более быстром получении рабочего презентационного материала.</tspan><tspan x="42" y="296">• Экономия времени КМ</tspan><tspan x="42" y="333">• Снижение ручной работы при подготовке презентации</tspan><tspan x="42" y="370">• Более быстрый переход от контекста к рабочему материалу</tspan><tspan x="42" y="407">• Более предсказуемое получение презентационного результата</tspan></text>
</g>
</g>
<text data-role="bmc-footer" x="174" y="2054" font-family="Inter, Arial, sans-serif" font-size="24" fill="#64748b">SVG является каноническим визуальным источником; PNG и PDF генерируются из него.</text>
</svg>
