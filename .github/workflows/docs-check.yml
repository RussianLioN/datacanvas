name: docs-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out SHA
        env:
          EXPECTED_GIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate-ci-exact-sha.mjs
      - name: Fetch canonical history base
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.8.0
      - name: Install render tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin poppler-utils
      - name: Install dependencies
        run: npm ci
      - name: Run repository quality gate
        run: npm test
      - name: Check deterministic docs navigation generation
        run: npm run check:docs-navigation
      - name: Check generated artifacts are committed
        run: git diff --exit-code
      - name: Check whitespace
        run: git diff --check
