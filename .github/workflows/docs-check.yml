name: docs-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.8.0
      - name: Install render tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Install dependencies
        run: npm ci
      - name: Run repository quality gate
        run: npm test
      - name: Check deterministic docs navigation generation
        run: npm run check:docs-navigation
      - name: Check generated artifacts are committed
        run: git diff --exit-code
      - name: Check whitespace
        run: git diff --check
